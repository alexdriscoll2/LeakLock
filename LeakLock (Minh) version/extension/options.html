<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your filters · Leak Lock</title><link rel="stylesheet" href="ui.css"></head><body class="options"><main>
<header><a class="brand" href="#" aria-label="Leak Lock home"><span class="brand-mark" aria-hidden="true">▰</span> leak lock</a><label class="switch"><input id="enabled" type="checkbox" aria-label="Enable Leak Lock"><span id="enabled-label">On</span></label></header>
<div class="heading"><div><h1>Your filters</h1></div><span id="rule-count" class="badge">0 on</span></div>
<section aria-label="Your filters"><div id="rules" class="rule-list"></div></section>
<details class="card add-card" id="custom-filter"><summary>Add a filter <span aria-hidden="true">+</span></summary><form id="add-rule"><label for="rule-name">Name</label><input id="rule-name" maxlength="160" placeholder="Name your filter"><label for="rule-terms">Filter content</label><textarea id="rule-terms" placeholder="Words or phrases to hide…" rows="4" required></textarea><button type="submit" class="primary full">Add filter</button></form></details>
<details class="card"><summary>Allowed & paused</summary><div class="detail-body"><h3>Always allowed</h3><div id="allow-list"></div><h3>Paused sites</h3><div id="pause-list"></div></div></details>
<details class="card"><summary>Settings</summary><div class="detail-body"><label class="inline">Default hide style <select id="default-action"><option value="blur">Blur</option><option value="collapse">Collapse</option></select></label><p class="muted">Text matches only. Images, video and audio aren't analyzed. Reveal shows a post for 30 seconds.</p><label class="inline demo-setting"><input id="demo-controls" type="checkbox" aria-describedby="demo-controls-note">Demo controls</label><p class="muted" id="demo-controls-note">Show a small hide button on hover. For demos only.</p><div class="row"><button id="export">Export</button><label class="file-label">Import<input id="import" type="file" accept="application/json,.json"></label></div></div></details>
<p id="feedback" role="status" aria-live="polite"></p></main><script src="ui.js"></script></body></html>
